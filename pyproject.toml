[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kanban-tui"
description = "Read-only terminal board view for the Hermes Agent kanban"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ebbwater LLC" }]
keywords = ["hermes", "kanban", "tui", "curses", "terminal", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
kanban-tui = "kanban_tui:cli_main"

[project.urls]
Homepage = "https://github.com/kylernunan/hermes-kanban-tui"
Source = "https://github.com/kylernunan/hermes-kanban-tui"
Issues = "https://github.com/kylernunan/hermes-kanban-tui/issues"

[tool.setuptools]
# One module, no package tree: the install ships exactly the viewer.
py-modules = ["kanban_tui"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "kanban_tui.VERSION" }
