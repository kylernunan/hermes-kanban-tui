name: release

# Publishes to PyPI with Trusted Publishing (OIDC): no token is stored anywhere.
# Requires a "pending publisher" on PyPI for this repo before the first run:
#   project      hermes-kanban-tui
#   owner        kylernunan
#   repository   hermes-kanban-tui
#   workflow     release.yml
#   environment  pypi
#
#   git tag -a v1.0.0 -m "hermes-kanban-tui 1.0.0" && git push origin v1.0.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-kanban-tui
    permissions:
      id-token: write        # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: the release tag must match the module version
        run: |
          set -euo pipefail
          mod="$(python kanban_tui.py --version | awk '{print $3}')"
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF_NAME#v}"
              echo "publishing from tag $tag, module $mod"
              test "$tag" = "$mod" || { echo "tag and VERSION disagree; refusing to publish"; exit 1; }
              ;;
            *)
              # Manual dispatch: the exact commit must already carry v<version>.
              echo "publishing from dispatch, module $mod"
              git fetch --tags --force
              git tag --points-at HEAD | grep -qx "v$mod" \
                || { echo "HEAD has no v$mod tag; refusing to publish"; exit 1; }
              ;;
          esac

      - name: suite must pass on the exact bytes being published
        run: python -m unittest test_kanban_tui

      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --sdist

      - name: the wheel carries the module and nothing else
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert names[0] == "kanban_tui.py", names
          print("\n".join(names))
          EOF

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
